<!doctype html><html lang=id><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script><script src=kbr.js></script><title>Admin KABAURIA</title></head><body><header>KABAURIA Kaos Tambang · Admin</header><main id=app></main><script>
let TAB='orders',PF=[],PR=[];
gate('admin',(pf,b)=>{b.innerHTML='<div class="tabs card">'+[['orders','Pesanan'],['sale','Jual langsung'],['prod','Produk'],['aff','Affiliate'],['pay','Pembayaran']].map(t=>'<button data-t="'+t[0]+'">'+t[1]+'</button>').join('')+'</div><div id=v></div>';
 b.querySelectorAll('[data-t]').forEach(x=>x.onclick=()=>{TAB=x.dataset.t;draw()});draw()});
const run=async(p,ok)=>{const{error}=await p;if(error)alert(error.message);else{ok&&alert(ok);draw()}};
async function draw(){document.querySelectorAll('[data-t]').forEach(x=>x.classList.toggle('on',x.dataset.t===TAB));const v=$('v');
 PF=(await sb.from('kbr_profiles').select('*').eq('role','affiliate').order('created_at')).data||[];PR=(await sb.from('kbr_products').select('*').order('created_at',{ascending:false})).data||[];
 const an=id=>{const a=PF.find(x=>x.id===id);return a?a.name+' ('+a.code+')':'Admin / tanpa affiliate'};
 if(TAB==='orders'){const O=(await sb.from('kbr_orders').select('*').order('created_at',{ascending:false})).data||[];
  v.innerHTML='<div class="card tw"><table><tr><th>Pesanan</th><th>Pelanggan</th><th>Produk</th><th>Penjual</th><th>Status</th><th>Aksi</th></tr>'+O.map(o=>'<tr><td>'+esc(o.order_no)+'<br><span class=mut>'+new Date(o.created_at).toLocaleString('id-ID')+'</span></td><td>'+esc(o.customer_name)+'<br>📞 '+esc(o.phone)+'<br>📍 '+esc(o.address)+', '+esc(o.city)+'<br><span class=mut>'+esc(o.note||'')+'</span><br><span class=mut>Bayar: '+esc(o.pay_method||'-')+'</span></td><td>'+esc(o.product_name)+' ×'+o.qty+'<br>'+rp(o.total)+'</td><td>'+esc(an(o.affiliate_id))+'<br><span class=mut>Komisi '+rp(o.c_amount)+' · '+ST[o.c_status]+'</span></td><td>'+ST[o.status]+'</td><td>'+(o.status==='awaiting_payment'?'<button class=g data-ok="'+o.id+'">Konfirmasi bayar</button>':'')+(o.status!=='cancelled'?'<button class=r data-no="'+o.id+'">Batalkan</button>':'')+'</td></tr>').join('')+'</table></div>';
  v.querySelectorAll('[data-ok]').forEach(x=>x.onclick=()=>run(sb.rpc('kbr_confirm',{p_order:x.dataset.ok})));
  v.querySelectorAll('[data-no]').forEach(x=>x.onclick=()=>confirm('Batalkan pesanan ini?')&&run(sb.rpc('kbr_cancel',{p_order:x.dataset.no})))}
 if(TAB==='sale'){v.innerHTML='<form id=sf class=card><h3>Penjualan oleh admin</h3><div class=mut>Langsung tercatat lunas. Kosongkan kode affiliate bila admin menjual sendiri (tanpa komisi). Isi kode bila penjualan ini dibantu affiliate (komisi dihitung).</div><select id=sp>'+PR.filter(p=>p.active).map(p=>'<option value="'+p.id+'">'+esc(p.name)+' — '+rp(p.price)+'</option>').join('')+'</select><input id=sq type=number min=1 value=1><input id=sn placeholder="Nama pelanggan" required><input id=sh placeholder="HP / WhatsApp" required><textarea id=sa placeholder="Alamat" required></textarea><input id=sc placeholder="Kota / Kecamatan" required><textarea id=st2 placeholder="Ukuran / catatan"></textarea><input id=sr placeholder="Kode affiliate (opsional)"><button>Simpan penjualan</button></form>';
  $('sf').onsubmit=e=>{e.preventDefault();run(sb.rpc('kbr_admin_sale',{p_product:$('sp').value,p_qty:+$('sq').value,p_name:$('sn').value,p_phone:$('sh').value,p_address:$('sa').value,p_city:$('sc').value,p_note:$('st2').value,p_ref:$('sr').value.trim()}),'Penjualan tercatat.');$('sf').reset()}}
 if(TAB==='prod'){v.innerHTML='<form id=pf class=card><h3>Tambah produk</h3><input id=pn placeholder="Nama produk" required><input id=pp type=number min=0 placeholder="Harga" required><input id=pi placeholder="URL gambar (opsional)"><button>Tambah</button></form><div class="card tw"><table>'+PR.map(p=>'<tr><td>'+esc(p.name)+'</td><td>'+rp(p.price)+'</td><td><button class=s data-tg="'+p.id+'">'+(p.active?'Aktif (klik untuk sembunyikan)':'Tersembunyi (klik untuk aktifkan)')+'</button><button class=r data-del="'+p.id+'">Hapus</button></td></tr>').join('')+'</table></div>';
  $('pf').onsubmit=e=>{e.preventDefault();run(sb.from('kbr_products').insert({name:$('pn').value,price:+$('pp').value,image_url:$('pi').value||null}))};
  v.querySelectorAll('[data-del]').forEach(x=>x.onclick=()=>confirm('Hapus produk ini secara permanen? Riwayat pesanan lama tetap tersimpan.')&&run(sb.from('kbr_products').delete().eq('id',x.dataset.del)));
  v.querySelectorAll('[data-tg]').forEach(x=>x.onclick=()=>run(sb.from('kbr_products').update({active:!PR.find(p=>p.id===x.dataset.tg).active}).eq('id',x.dataset.tg)))}
 if(TAB==='pay'){const{data:S}=await sb.from('kbr_settings').select('pay').single();const Z=S.pay||{},q=Z.qris||{},t=Z.transfer||{},c=Z.cash||{};let img=q.img||'';
  v.innerHTML='<form id=yf class=card><h3>Metode pembayaran</h3><label><input type=checkbox id=qo '+(q.on?'checked':'')+' style="width:auto"> <b>QRIS</b> aktif</label><input type=file id=qf accept="image/*"><div id=qp>'+(img?'<img src="'+img+'" style="max-width:200px">':'<span class=mut>Belum ada gambar QRIS</span>')+'</div><hr>'
  +'<label><input type=checkbox id=to '+(t.on?'checked':'')+' style="width:auto"> <b>Transfer bank</b> aktif</label><input id=tb placeholder="Nama bank" value="'+esc(t.bank||'')+'"><input id=tn placeholder="Nomor rekening" value="'+esc(t.no||'')+'"><input id=ta placeholder="Atas nama" value="'+esc(t.name||'')+'"><hr>'
  +'<label><input type=checkbox id=co '+(c.on?'checked':'')+' style="width:auto"> <b>Tunai</b> aktif</label><textarea id=cn placeholder="Catatan tunai, mis. bayar ke admin/affiliate saat barang diterima">'+esc(c.note||'')+'</textarea><button>Simpan</button></form>';
  $('qf').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,800/Math.max(im.width,im.height)),cv=document.createElement('canvas');cv.width=im.width*k;cv.height=im.height*k;cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);img=cv.toDataURL('image/png');$('qp').innerHTML='<img src="'+img+'" style="max-width:200px">'};im.src=r.result};r.readAsDataURL(f)};
  $('yf').onsubmit=e=>{e.preventDefault();run(sb.from('kbr_settings').update({pay:{qris:{on:$('qo').checked,img},transfer:{on:$('to').checked,bank:$('tb').value,no:$('tn').value,name:$('ta').value},cash:{on:$('co').checked,note:$('cn').value}}}).eq('id',1),'Metode pembayaran disimpan.')}}
 if(TAB==='aff'){const{data:S}=await sb.from('kbr_settings').select('*').single();const O=(await sb.from('kbr_orders').select('affiliate_id,c_amount').eq('c_status','pending')).data||[];
  v.innerHTML='<div class=card><b>Komisi default</b>: '+cl(S.c_mode,S.c_value)+' <button class=s id=dd>Ubah default</button></div>'+PF.map(a=>{const owed=O.filter(o=>o.affiliate_id===a.id).reduce((n,o)=>n+ +o.c_amount,0);return '<div class=card><b>'+esc(a.name)+' · '+esc(a.code)+'</b> '+(a.active?'(Aktif)':'(Belum aktif)')+'<div class=mut>'+esc(a.email)+' · sampai '+esc(a.ends_at||'-')+'</div><div>Komisi: '+(a.c_mode==='default'?'ikut default':cl(a.c_mode,a.c_value))+' · Belum dibayar: <b>'+rp(owed)+'</b></div><button data-act="'+a.id+'" class='+(a.active?'r':'g')+'>'+(a.active?'Nonaktifkan':'Setujui / aktifkan (6 bulan)')+'</button><button class=s data-cm="'+a.id+'">Atur komisi</button>'+(owed>0?'<button data-pay="'+a.id+'">Tandai dibayar '+rp(owed)+'</button>':'')+'</div>'}).join('');
  $('dd').onclick=()=>{const m=prompt('Mode default: fixed (Rp per pcs) atau percent (%)',S.c_mode);if(!['fixed','percent'].includes(m))return;const x=prompt('Nilai',S.c_value);if(x!==null)run(sb.from('kbr_settings').update({c_mode:m,c_value:+x}).eq('id',1))};
  v.querySelectorAll('[data-act]').forEach(x=>x.onclick=()=>{const a=PF.find(p=>p.id===x.dataset.act),d=new Date();d.setMonth(d.getMonth()+6);run(sb.from('kbr_profiles').update(a.active?{active:false}:{active:true,ends_at:(a.ends_at&&a.ends_at>=new Date().toISOString().slice(0,10))?a.ends_at:d.toISOString().slice(0,10)}).eq('id',a.id))});
  v.querySelectorAll('[data-cm]').forEach(x=>x.onclick=()=>{const m=prompt('Komisi affiliate ini: default / fixed / percent','fixed');if(!['default','fixed','percent'].includes(m))return;let n=0;if(m!=='default'){n=+prompt('Nilai (Rp per pcs atau %)','0');if(isNaN(n)||n<0||(m==='percent'&&n>100))return alert('Nilai tidak valid')}run(sb.from('kbr_profiles').update({c_mode:m,c_value:n}).eq('id',x.dataset.cm),'Berlaku untuk pesanan yang dikonfirmasi setelah ini.')});
  v.querySelectorAll('[data-pay]').forEach(x=>x.onclick=()=>confirm('Pastikan transfer sudah dilakukan. Lanjut?')&&run(sb.from('kbr_orders').update({c_status:'paid_out'}).eq('affiliate_id',x.dataset.pay).eq('c_status','pending')))}}
</script></body></html>
