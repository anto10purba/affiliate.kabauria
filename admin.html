async function saveOrder(o){const u={};["status","product","qty","total","qty_claimed","total_claimed","commission_unit","commission","commission_original","commission_note","commission_adjusted_at","verification_at","paid_at","paid_confirmed_by"].forEach(k=>{if(o[k]!==undefined)u[k]=o[k]});const{error}=await sb.from("orders").update(u).eq("order_id",o.order_id);if(error){alert("Gagal menyimpan: "+error.message);await loadAll();return false}return true}
function sched(){clearTimeout(tm);tm=setTimeout(loadAll,400)}
function notify(o,label){unread++;document.title="("+unread+") "+label+" — KABAURIA Admin";toast.textContent=label+": "+o.order_id+" · "+o.customer;toast.style.display="block";setTimeout(()=>toast.style.display="none",8000);try{const c=new(window.AudioContext||window.webkitAudioContext)(),s=c.createOscillator();s.connect(c.destination);s.frequency.value=880;s.start();s.stop(c.currentTime+.25)}catch(e){}}
addEventListener("focus",()=>{unread=0;document.title="KABAURIA — Admin"});
function subscribe(){if(ch)return;ch=sb.channel("kbr-admin").on("postgres_changes",{event:"*",schema:"public",table:"orders"},p=>{if(p.eventType==="INSERT")notify(p.new,"Pesanan baru");else if(p.eventType==="UPDATE"&&p.new.status==="WAITING_VERIFICATION")notify(p.new,"Menunggu verifikasi");sched()}).on("postgres_changes",{event:"*",schema:"public",table:"payouts"},sched).on("postgres_changes",{event:"*",schema:"public",table:"affiliates"},sched).on("postgres_changes",{event:"*",schema:"public",table:"audit_log"},sched).subscribe()}
async function enter(){const{data}=await sb.rpc("is_admin");if(data!==true){await sb.auth.signOut();gmsg.textContent="Akun ini belum terdaftar sebagai admin. Jalankan file 02_jadikan_admin.sql di Supabase.";return}gate.style.display="none";app.style.display="block";await loadAll();loadPayments();subscribe()}
async function login(){gmsg.textContent="";const{error}=await sb.auth.signInWithPassword({email:em.value.trim(),password:pw.value});if(error){gmsg.textContent="Email atau password salah.";return}await enter()}
async function logout(){await sb.auth.signOut();location.reload()}
pw.onkeydown=e=>{if(e.key==="Enter")login()};
(async()=>{const{data}=await sb.auth.getSession();if(data.session)await enter()})();
</script></body></html>
