<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KABAURIA — Affiliate</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f3f3;font-family:Arial;color:#111}.wrap{max-width:800px;margin:auto;padding:20px}.brand{font-size:29px;font-weight:900;letter-spacing:4px}.sub{color:#777}.card,.stat{background:#fff;border:1px solid #ddd;border-radius:15px;padding:18px;margin-top:15px}.login{max-width:450px;margin:45px auto}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat b{display:block;font-size:21px;margin-top:5px}input{width:100%;padding:13px;border:1px solid #bbb;border-radius:9px;font-size:15px}button{border:0;border-radius:9px;padding:12px 14px;background:#111;color:#fff;font-weight:bold;margin-top:10px}.gray{background:#777}.link{background:#f3f3f3;padding:12px;border-radius:9px;word-break:break-all;font-size:13px;margin-top:10px}.order{border-bottom:1px solid #eee;padding:14px 0}.badge{display:inline-block;padding:5px 8px;border-radius:20px;background:#eee;font-size:11px}.green{background:#e3f6e7}.yellow{background:#fff4cf}.red{background:#fde2e2;color:#a00000}.redbtn{background:#a00000}.cancelnote{background:#fde2e2;border-radius:8px;padding:8px 10px;margin-top:8px;font-size:13px;color:#a00000}@media(max-width:650px){.grid{grid-template-columns:1fr 1fr}}</style></head><body><div class="wrap"><div class="brand">KABAURIA</div><div class="sub">Affiliate Dashboard</div><div id="login" class="card login"><h2>Masuk Affiliate</h2><p>Masukkan kode dan PIN affiliate kamu.</p><input id="loginCode" placeholder="Kode affiliate, contoh: AGS01" autocomplete="username"><input id="loginPin" inputmode="numeric" maxlength="8" placeholder="PIN 4–8 digit" autocomplete="current-password" style="margin-top:8px"><button onclick="doLogin()">Masuk</button></div><div id="dash" style="display:none"><div class="card"><h2 id="hello"></h2><div>Link jualan kamu:</div><div class="link" id="myLink"></div><div id="linkWarn" style="font-size:12px;color:#a00000;margin-top:8px"></div><div id="prodBox" style="display:none;margin-top:14px"><div>Link produk:</div><div class="link" id="prodLink"></div><button onclick="copyProd()">Copy Link Produk</button></div><button onclick="copyLink()">Copy Link</button><button style="background:#25D366" onclick="shareWA()">Bagikan via WhatsApp</button><button class="gray" onclick="logout()">Keluar</button></div><div class="grid"><div class="stat">Terjual<b id="sold">0</b></div><div class="stat">Omzet<b id="sales">Rp0</b></div><div class="stat">Komisi PAID<b id="comm">Rp0</b></div><div class="stat">Saldo Komisi<b id="balance">Rp0</b></div></div><div id="saldoNote" style="margin-top:10px;font-size:12px;color:#777"></div><div class="card"><h2>Riwayat Pencairan</h2><div id="payouts"></div></div><div class="card"><h2>Order Saya</h2><div id="orders"></div></div></div></div><script>const SB_URL="https://ubqnltsjjfdcdaociida.supabase.co",SB_KEY="sb_publishable_WtDMjW-6R2bMLW7Exl8Y3w_eziCCpdZ";
async function rpc(fn,args){const r=await fetch(SB_URL+"/rest/v1/rpc/"+fn,{method:"POST",headers:{"Content-Type":"application/json",apikey:SB_KEY},body:JSON.stringify(args||{})});const t=await r.text();let j=null;try{j=t?JSON.parse(t):null}catch(e){}if(!r.ok)throw new Error((j&&(j.message||j.hint))||"Gagal terhubung ke server ("+r.status+")");if(j&&j.error)throw new Error(j.error);return j}</script>
<script>
let me=null,D=null;function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]))}
function money(n){n=Number(n||0);return(n<0?"-":"")+"Rp"+Math.abs(n).toLocaleString("id-ID")}
async function doLogin(){let c=loginCode.value.trim().toUpperCase(),pin=loginPin.value.trim();if(!c||!pin)return alert("Isi kode dan PIN affiliate.");sessionStorage.setItem("KABAURIA_AFF",c);sessionStorage.setItem("KABAURIA_PIN",pin);await reload(true)}
async function reload(manual){let c=sessionStorage.getItem("KABAURIA_AFF"),p=sessionStorage.getItem("KABAURIA_PIN");if(!c||!p)return;try{D=await rpc("kb_aff_login",{p_code:c,p_pin:p});show()}catch(e){if(manual||!D){sessionStorage.removeItem("KABAURIA_AFF");sessionStorage.removeItem("KABAURIA_PIN")}if(manual)alert(e.message||"Gagal masuk.")}}
function show(){if(!D)return;me=D.affiliate;login.style.display="none";dash.style.display="block";hello.textContent="Halo, "+me.name;myLink.textContent=shopLink(me.code);let pl=String(D.product_link||"").trim();if(/^https?:\/\//i.test(pl)){prodLink.textContent=pl;prodBox.style.display="block"}else prodBox.style.display="none";linkWarn.textContent=/^https?:$/.test(location.protocol)?"":"⚠ Ini masih alamat lokal (bukan alamat website), jadi link tidak bisa dibuka orang lain. Unggah file ke hosting (misalnya GitHub Pages) lalu buka dari alamat https://...";let os=D.orders||[],ps=D.payouts||[],paid=os.filter(o=>o.status==="PAID"),earned=paid.reduce((s,o)=>s+Number(o.commission||0),0),withdrawn=ps.filter(x=>x.status!=="VOID").reduce((s,x)=>s+Number(x.amount||0),0);sold.textContent=paid.reduce((s,o)=>s+(Number(o.qty)||1),0);sales.textContent=money(paid.reduce((s,o)=>s+Number(o.total||0),0));comm.textContent=money(earned);let bal=earned-withdrawn;balance.textContent=money(bal);balance.style.color=bal<0?"#a00000":"";saldoNote.textContent=bal<0?"Saldo kamu minus; akan dipotong dari komisi berikutnya.":"";payouts.innerHTML=ps.length?ps.slice().reverse().map(x=>`<div class="order"><b>${esc(x.payout_id)}</b><br>${money(x.amount)} · ${new Date(x.paid_at).toLocaleString("id-ID")}<br>Status: <span class="badge green">Dibayar</span></div>`).join(""):"Belum ada pencairan.";orders.innerHTML=os.length?os.slice().reverse().map(o=>`<div class="order"><b>${esc(o.order_id)}</b> · ${esc(o.customer)}${o.product?` · ${esc(o.product)}`:""}<br>Jumlah ${Number(o.qty)||1} · ${o.total!=null&&o.total!==""?money(o.total):"Harga menunggu verifikasi"} · Komisi ${money(o.commission)}${o.commission_note?`<br><span style="font-size:12px;color:#777">Komisi disesuaikan: ${esc(o.commission_note)}</span>`:""}${o.address?`<br><span style="font-size:12px;color:#555">Alamat: ${esc(o.address)}</span>`:""}${o.note?`<br><span style="font-size:12px;color:#555">Catatan: ${esc(o.note)}</span>`:""}<br>Status: <span class="badge ${o.status==="PAID"?"green":o.status==="WAITING_VERIFICATION"?"yellow":o.status==="CANCELLED"?"red":""}">${esc(o.status)}</span>${o.status==="WAITING_PAYMENT"?`<br><button onclick="requestVerify('${esc(o.order_id)}')">Pembayaran Sudah Diterima</button>`:""}${(o.status==="WAITING_PAYMENT"||o.status==="WAITING_VERIFICATION")?`<br><button class="redbtn" onclick="cancelOrder('${esc(o.order_id)}')">Batalkan Pesanan</button>`:""}${o.status==="PAID"?`<div style="font-size:12px;color:#777;margin-top:6px">Order PAID hanya bisa dibatalkan oleh Admin.</div>`:""}${o.status==="CANCELLED"?`<div class="cancelnote"><b>Dibatalkan</b> oleh ${o.cancelled_by==="ADMIN"?"Admin":"Affiliate"}${o.cancelled_at?" · "+new Date(o.cancelled_at).toLocaleString("id-ID"):""}<br>Catatan: ${esc(o.cancel_note||"-")}</div>`:""}</div>`).join(""):"Belum ada order."}
async function requestVerify(id){if(!confirm("Tandai pelanggan sudah membayar? Order akan menunggu verifikasi Admin."))return;try{await rpc("kb_aff_act",{p_code:me.code,p_pin:sessionStorage.getItem("KABAURIA_PIN"),p_action:"verify",p_order:id,p_note:""});await reload()}catch(e){alert(e.message)}}
async function cancelOrder(id){let why=prompt("Catatan pembatalan order "+id+" (wajib diisi):","");if(why===null)return;why=why.trim();if(!why)return alert("Catatan pembatalan wajib diisi.");if(!confirm("Batalkan order "+id+"?\nCatatan: "+why+"\n\nPembatalan tidak bisa dikembalikan."))return;try{await rpc("kb_aff_act",{p_code:me.code,p_pin:sessionStorage.getItem("KABAURIA_PIN"),p_action:"cancel",p_order:id,p_note:why});await reload()}catch(e){alert(e.message)}}
function shopLink(code){const u=new URL("index.html",location.href);u.search="";u.hash="";u.searchParams.set("ref",code);return u.href}
function shareWA(){window.open("https://wa.me/?text="+encodeURIComponent("Order produk KABAURIA lewat link ini ya: "+myLink.textContent),"_blank")}
function copyLink(){let t=myLink.textContent,fb=()=>{try{let x=document.createElement("textarea");x.value=t;x.setAttribute("readonly","");x.style.position="fixed";x.style.opacity="0";document.body.appendChild(x);x.select();let ok=document.execCommand("copy");x.remove();if(!ok)throw 0;alert("Link disalin")}catch(e){prompt("Salin link ini:",t)}};if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(t).then(()=>alert("Link disalin")).catch(fb);else fb()}
function copyProd(){let t=prodLink.textContent,fb=()=>{try{let x=document.createElement("textarea");x.value=t;x.setAttribute("readonly","");x.style.position="fixed";x.style.opacity="0";document.body.appendChild(x);x.select();let ok=document.execCommand("copy");x.remove();if(!ok)throw 0;alert("Link produk disalin")}catch(e){prompt("Salin link produk ini:",t)}};if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(t).then(()=>alert("Link produk disalin")).catch(fb);else fb()}
function logout(){sessionStorage.removeItem("KABAURIA_AFF");sessionStorage.removeItem("KABAURIA_PIN");location.reload()}reload();setInterval(()=>{if(D)reload()},20000);</script></body></html>
