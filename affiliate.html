<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KABAURIA — Affiliate</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f3f3;font-family:Arial;color:#111}.wrap{max-width:800px;margin:auto;padding:20px}.brand{font-size:29px;font-weight:900;letter-spacing:4px}.sub{color:#777}.card,.stat{background:#fff;border:1px solid #ddd;border-radius:15px;padding:18px;margin-top:15px}.login{max-width:450px;margin:45px auto}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat b{display:block;font-size:21px;margin-top:5px}input{width:100%;padding:13px;border:1px solid #bbb;border-radius:9px;font-size:15px}button{border:0;border-radius:9px;padding:12px 14px;background:#111;color:#fff;font-weight:bold;margin-top:10px}.gray{background:#777}.link{background:#f3f3f3;padding:12px;border-radius:9px;word-break:break-all;font-size:13px;margin-top:10px}.order{border-bottom:1px solid #eee;padding:14px 0}.badge{display:inline-block;padding:5px 8px;border-radius:20px;background:#eee;font-size:11px}.green{background:#e3f6e7}.yellow{background:#fff4cf}@media(max-width:650px){.grid{grid-template-columns:1fr 1fr}}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><div class="wrap"><div class="brand">KABAURIA</div><div class="sub">Affiliate Dashboard</div><div id="login" class="card login"><h2>Masuk Affiliate</h2><p>Masukkan kode dan PIN affiliate kamu.</p><input id="loginCode" placeholder="Kode affiliate, contoh: AGS01" autocomplete="username"><input id="loginPin" inputmode="numeric" maxlength="8" placeholder="PIN 4–8 digit" autocomplete="current-password" style="margin-top:8px"><button onclick="doLogin()">Masuk</button></div><div id="dash" style="display:none"><div class="card"><h2 id="hello"></h2><div>Link jualan kamu:</div><div class="link" id="myLink"></div><div id="linkWarn" style="font-size:12px;color:#a00000;margin-top:8px"></div><button onclick="copyLink()">Copy Link</button><button style="background:#25D366" onclick="shareWA()">Bagikan via WhatsApp</button><button class="gray" onclick="logout()">Keluar</button></div><div class="grid"><div class="stat">Terjual<b id="sold">0</b></div><div class="stat">Omzet<b id="sales">Rp0</b></div><div class="stat">Komisi PAID<b id="comm">Rp0</b></div><div class="stat">Saldo Komisi<b id="balance">Rp0</b></div></div><div id="saldoNote" style="margin-top:10px;font-size:12px;color:#777"></div><div class="card"><h2>Riwayat Pencairan</h2><div id="payouts"></div></div><div class="card"><h2>Order Saya</h2><div id="orders"></div></div></div></div><script>
const SB_URL="https://ubqnltsjjfdcdaociida.supabase.co",SB_KEY="sb_publishable_WtDMjW-6R2bMLW7Exl8Y3w_eziCCpdZ",sb=supabase.createClient(SB_URL,SB_KEY);
let me=null,tm=null;function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]))}
function money(n){n=Number(n||0);return(n<0?"-":"")+"Rp"+Math.abs(n).toLocaleString("id-ID")}
async function load(c,p){const{data,error}=await sb.rpc("affiliate_dashboard",{p_code:c,p_pin:p});return error||!data?{ok:false,error:"net"}:data}
function errMsg(e){return e==="locked"?"Terlalu banyak percobaan salah. Coba lagi 15 menit lagi.":e==="net"?"Gagal terhubung. Periksa koneksi internet.":"Kode atau PIN affiliate tidak cocok, atau affiliate nonaktif."}
async function doLogin(){let c=loginCode.value.trim().toUpperCase().replace(/[^A-Z0-9]/g,""),p=loginPin.value.trim(),d=await load(c,p);if(!d.ok)return alert(errMsg(d.error));sessionStorage.setItem("KBR_AFF",c);sessionStorage.setItem("KBR_PIN",p);show(d);poll()}
async function refresh(){let c=sessionStorage.getItem("KBR_AFF"),p=sessionStorage.getItem("KBR_PIN");if(!c)return;let d=await load(c,p);if(d.ok)show(d);else if(d.error!=="net"){sessionStorage.clear();location.reload()}}
function poll(){clearInterval(tm);tm=setInterval(()=>{if(!document.hidden)refresh()},10000)}
function show(d){me=d.affiliate;login.style.display="none";dash.style.display="block";hello.textContent="Halo, "+me.name;myLink.textContent=shopLink(me.code);linkWarn.textContent=/^https?:$/.test(location.protocol)?"":"⚠ Ini masih alamat lokal (bukan alamat website), jadi link tidak bisa dibuka orang lain. Unggah file ke hosting (misalnya GitHub Pages) lalu buka dari alamat https://...";let os=d.orders,ps=d.payouts,paid=os.filter(o=>o.status==="PAID"),earned=paid.reduce((s,o)=>s+Number(o.commission||0),0),withdrawn=ps.filter(x=>x.status!=="VOID").reduce((s,x)=>s+Number(x.amount||0),0);sold.textContent=paid.reduce((s,o)=>s+(Number(o.qty)||1),0);sales.textContent=money(paid.reduce((s,o)=>s+Number(o.total||0),0));comm.textContent=money(earned);let bal=earned-withdrawn;balance.textContent=money(bal);balance.style.color=bal<0?"#a00000":"";saldoNote.textContent=bal<0?"Saldo kamu minus; akan dipotong dari komisi berikutnya.":"";payouts.innerHTML=ps.length?ps.slice().reverse().map(x=>`<div class="order"><b>${esc(x.payout_id)}</b><br>${money(x.amount)} · ${new Date(x.paid_at).toLocaleString("id-ID")}<br>Status: <span class="badge green">Dibayar</span></div>`).join(""):"Belum ada pencairan.";orders.innerHTML=os.length?os.slice().reverse().map(o=>`<div class="order"><b>${esc(o.order_id)}</b> · ${esc(o.customer)}${o.product?` · ${esc(o.product)}`:""}<br>Jumlah ${Number(o.qty)||1} · ${o.total!=null&&o.total!==""?money(o.total):"Harga menunggu verifikasi"} · Komisi ${money(o.commission)}${o.commission_note?`<br><span style="font-size:12px;color:#777">Komisi disesuaikan: ${esc(o.commission_note)}</span>`:""}<br>Status: <span class="badge ${o.status==="PAID"?"green":o.status==="WAITING_VERIFICATION"?"yellow":""}">${esc(o.status)}</span>${o.status==="WAITING_PAYMENT"?`<br><button onclick="requestVerify('${esc(o.order_id)}')">Pembayaran Sudah Diterima</button>`:""}</div>`).join(""):"Belum ada order."}
async function requestVerify(id){if(!confirm("Tandai pelanggan sudah membayar? Order akan menunggu verifikasi Admin."))return;const{data,error}=await sb.rpc("affiliate_request_verification",{p_code:sessionStorage.getItem("KBR_AFF"),p_pin:sessionStorage.getItem("KBR_PIN"),p_order_no:id});if(error||!data||!data.ok)alert("Gagal: order tidak ditemukan atau statusnya sudah berubah.");refresh()}
function shopLink(code){const u=new URL("index.html",location.href);u.search="";u.hash="";u.searchParams.set("ref",code);return u.href}
function shareWA(){window.open("https://wa.me/?text="+encodeURIComponent("Order produk KABAURIA lewat link ini ya: "+myLink.textContent),"_blank")}
function copyLink(){let t=myLink.textContent,fb=()=>{try{let x=document.createElement("textarea");x.value=t;x.setAttribute("readonly","");x.style.position="fixed";x.style.opacity="0";document.body.appendChild(x);x.select();let ok=document.execCommand("copy");x.remove();if(!ok)throw 0;alert("Link disalin")}catch(e){prompt("Salin link ini:",t)}};if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(t).then(()=>alert("Link disalin")).catch(fb);else fb()}
function logout(){sessionStorage.clear();location.reload()}refresh().then(poll);</script></body></html>
