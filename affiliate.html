<!doctype html><html lang=id><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script><script src=kbr.js></script><title>Affiliate KABAURIA</title></head><body><header>KABAURIA Kaos Tambang · Affiliate</header><main id=app></main><script>
gate('affiliate',async(pf,b)=>{const{data}=await sb.rpc('kbr_my_orders');const L=data||[],sum=s=>L.filter(x=>x.c_status===s).reduce((n,x)=>n+ +x.c_amount,0);
const link=location.origin+location.pathname.replace('affiliate.html','index.html')+'?ref='+pf.code;
b.innerHTML='<div class=card><b>Link referral Anda</b><input id=l readonly value="'+esc(link)+'"><button onclick="navigator.clipboard.writeText($(\'l\').value);this.textContent=\'Tersalin\'">Salin link</button><div class=mut>Kode: '+esc(pf.code)+' · Komisi: '+(pf.c_mode==='default'?'mengikuti default admin':cl(pf.c_mode,pf.c_value))+' · Aktif sampai: '+esc(pf.ends_at||'-')+'</div></div>'
+'<div class="card st"><div>Komisi belum dibayar<b>'+rp(sum('pending'))+'</b></div><div>Sudah dibayar<b>'+rp(sum('paid_out'))+'</b></div><div>Pesanan<b>'+L.length+'</b></div></div>'
+'<div class="card tw"><table><tr><th>No.</th><th>Produk</th><th>Total</th><th>Status</th><th>Komisi</th></tr>'+L.map(o=>'<tr><td>'+esc(o.order_no)+'</td><td>'+esc(o.product_name)+' ×'+o.qty+'</td><td>'+rp(o.total)+'</td><td>'+ST[o.status]+'</td><td>'+rp(o.c_amount)+'<br><span class=mut>'+ST[o.c_status]+'</span></td></tr>').join('')+'</table></div>'});
</script></body></html>
