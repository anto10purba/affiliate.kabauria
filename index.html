<!doctype html><html lang=id><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script><script src=kbr.js></script><title>KABAURIA Kaos Tambang</title></head><body><header>KABAURIA Kaos Tambang</header><main id=app><div id=g class=grid></div>
<form id=f class=card style="display:none;margin-top:14px"><h3>Pesan produk</h3><b id=sel></b><input type=hidden id=pid>
<input id=n placeholder="Nama lengkap" required><input id=h type=tel placeholder="Nomor HP / WhatsApp" required><input id=q type=number min=1 value=1 required>
<textarea id=a placeholder="Alamat lengkap pengiriman" required></textarea><input id=c placeholder="Kota / Kecamatan" required><textarea id=t placeholder="Ukuran / warna / catatan"></textarea>
<label class=mut>Metode pembayaran</label><select id=pm></select><button>Buat pesanan</button><div id=m class=m></div><div id=pay></div><div class=mut>Admin akan menghubungi Anda untuk pembayaran dan pengiriman.</div></form></main>
<script>
const r=new URLSearchParams(location.search).get('ref');if(r)localStorage.setItem('kbr_ref',r);
let P=[];(async()=>{const{data}=await sb.from('kbr_products').select('*').eq('active',true).order('created_at',{ascending:false});P=data||[];
$('g').innerHTML=P.map(p=>'<div class=card>'+(p.image_url?'<img src="'+esc(p.image_url)+'">':'')+'<b>'+esc(p.name)+'</b><div>'+rp(p.price)+'</div><button onclick="pick(\''+p.id+'\')">Pesan</button></div>').join('')||'Belum ada produk.'})();
function pick(id){const p=P.find(x=>x.id===id);$('pid').value=id;$('sel').textContent=p.name+' — '+rp(p.price);$('f').style.display='block';$('f').scrollIntoView()}
$('f').onsubmit=async e=>{e.preventDefault();const pp=P.find(x=>x.id===$('pid').value),tot=pp.price*(+$('q').value),pm=$('pm').value;const{data,error}=await sb.rpc('kbr_create_order',{p_pay:pm||null,p_product:$('pid').value,p_qty:+$('q').value,p_name:$('n').value,p_phone:$('h').value,p_address:$('a').value,p_city:$('c').value,p_note:$('t').value,p_ref:localStorage.getItem('kbr_ref')||''});
$('m').style.color=error?'':'#167647';$('m').textContent=error?error.message:'Pesanan '+data+' berhasil dibuat.';if(!error){$('f').reset();$('pay').innerHTML=payHtml(pm,tot,data);if($('cp'))$('cp').onclick=()=>navigator.clipboard.writeText(PAY.transfer.no).then(()=>$('cp').textContent='Tersalin')}}
let PAY={};(async()=>{const{data}=await sb.rpc('kbr_pay_info');PAY=data||{};$('pm').innerHTML=[['qris','QRIS'],['transfer','Transfer bank'],['cash','Tunai']].filter(x=>PAY[x[0]]&&PAY[x[0]].on).map(x=>'<option value="'+x[0]+'">'+x[1]+'</option>').join('')||'<option value="">Hubungi admin</option>'})();
function payHtml(pm,tot,no){const x=PAY[pm]||{};let h='<div class=card><b>Pesanan '+esc(no)+'</b><div>Total bayar: <b>'+rp(tot)+'</b></div>';
if(pm==='qris'&&x.img)h+='<div>Scan QRIS berikut:</div><img src="'+x.img+'" style="max-width:260px;width:100%">';
if(pm==='transfer')h+='<div>'+esc(x.bank)+' a.n. '+esc(x.name)+'</div><div>No. rekening: <b>'+esc(x.no)+'</b> <button type=button id=cp>Salin</button></div>';
if(pm==='cash')h+='<div>'+esc(x.note||'Pembayaran tunai.')+'</div>';
return h+'</div>'}
</script></body></html>
