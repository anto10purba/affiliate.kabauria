<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KABAURIA — Checkout</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f3f3;font-family:Arial;color:#111}
.wrap{max-width:520px;margin:auto;background:#fff;min-height:100vh;padding:20px}
.brand{font-size:30px;font-weight:900;letter-spacing:4px}
.sub{color:#777}
.card{border:1px solid #ddd;border-radius:16px;padding:18px;margin-top:14px}
.ref{background:#f4f4f4;padding:12px;border-radius:9px;margin:12px 0}
label{display:block;font-size:13px;font-weight:bold;margin:12px 0 5px}
input,select,textarea{width:100%;padding:13px;border:1px solid #bbb;border-radius:9px;font-size:15px}
button{width:100%;padding:14px;border:0;border-radius:9px;background:#111;color:#fff;font-weight:bold;margin-top:12px;font-size:14px}
button.gray{background:#777}
.method{border:1px solid #ddd;padding:11px;border-radius:9px;margin:8px 0}
.qris{max-width:230px;width:100%;display:block;margin:10px auto}
.result{display:none;margin-top:15px}
.oid{font-size:26px;font-weight:900;letter-spacing:2px;background:#f4f4f4;border-radius:10px;padding:14px;text-align:center;margin:8px 0}
.badge{display:inline-block;padding:6px 10px;border-radius:20px;background:#eee;font-size:12px;font-weight:bold}
.badge.yellow{background:#fff4cf}
.badge.green{background:#e3f6e7}
.badge.red{background:#fde2e2;color:#a00000}
textarea{font-family:Arial;resize:vertical}
.notice{background:#e8f7ec;border:1px solid #bfe6c8;color:#1c6b32;border-radius:10px;padding:11px 12px;margin-top:10px;font-size:13px;font-weight:bold;line-height:1.4}
.cancelbox{background:#fde2e2;border:1px solid #f3b8b8;color:#a00000;border-radius:10px;padding:12px;margin-top:12px;font-size:14px;line-height:1.5}
.box{background:#fafafa;border:1px solid #eee;border-radius:10px;padding:12px;margin-top:12px;font-size:14px;line-height:1.5}
.box ol{margin:6px 0 0;padding-left:20px}
.btnlink{display:block;text-align:center;padding:14px;border-radius:9px;background:#25D366;color:#fff;font-weight:bold;text-decoration:none;margin-top:12px;font-size:14px}
.prodbtn{background:#111;margin-top:0;margin-bottom:6px;letter-spacing:1px}
.small{font-size:12px;color:#777}
.copybtn{width:auto;display:inline-block;margin:0 0 0 8px;padding:6px 12px;font-size:12px;vertical-align:middle}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">KABAURIA</div>
  <div class="sub">Checkout Produk</div>

  <div class="card">
    <h2 id="productTitle" style="margin-top:0">Form Pesanan</h2>
    <div class="ref">Affiliate: <b id="aff">Tidak terdeteksi</b><br>Kode: <b id="code">-</b></div>
    <div id="prodTop"></div>

    <form id="form">
      <label>Nama</label><input id="customer" required>
      <label>WhatsApp</label><input id="wa" inputmode="tel" placeholder="Contoh: 08123456789" required>
      <label>Alamat pengiriman</label><textarea id="address" rows="3" maxlength="300" placeholder="Contoh: Jl. Melati No. 5, RT 02/RW 03, Kel. ..., Kec. ..." required></textarea>
      <div class="notice">🚚 Gratis ongkir area dalam kota, admin segera menghubungi anda</div>
      <label>Barang yang dipesan</label><input id="item" placeholder="Contoh: Kaos hitam" maxlength="120" autocomplete="off" required>
      <label>Jumlah</label><input id="qty" type="number" inputmode="numeric" min="1" max="9999" value="1" required>
      <label>Total harga (Rp)</label><input id="total" inputmode="numeric" placeholder="Contoh: 250000" autocomplete="off" required>
      <label>Catatan (opsional)</label><textarea id="note" rows="2" maxlength="300" placeholder="Contoh: warna, ukuran, patokan alamat, jam pengantaran"></textarea>
      <label>Metode Pembayaran</label>
      <div id="methods"></div>
      <button type="submit">BUAT PESANAN</button>
    </form>

    <div id="result" class="result"></div>
  </div>

  <div class="card">
    <h3 style="margin:0 0 4px">Cek Status Pesanan</h3>
    <div class="small">Masukkan nomor order kamu.</div>
    <input id="chk" placeholder="Contoh: KBR-BUD01-001" style="margin-top:10px" autocomplete="off">
    <button type="button" id="chkbtn" class="gray">Cek Status</button>
    <div id="chkres" class="small" style="margin-top:10px"></div>
  </div>
</div>

<script>const SB_URL="https://ubqnltsjjfdcdaociida.supabase.co",SB_KEY="sb_publishable_WtDMjW-6R2bMLW7Exl8Y3w_eziCCpdZ";
async function rpc(fn,args){const r=await fetch(SB_URL+"/rest/v1/rpc/"+fn,{method:"POST",headers:{"Content-Type":"application/json",apikey:SB_KEY},body:JSON.stringify(args||{})});const t=await r.text();let j=null;try{j=t?JSON.parse(t):null}catch(e){}if(!r.ok)throw new Error((j&&(j.message||j.hint))||"Gagal terhubung ke server ("+r.status+")");if(j&&j.error)throw new Error(j.error);return j}</script>
<script type="text/plain" id="app">
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
const rd = (k, d) => { try { return JSON.parse(localStorage.getItem(k) || d) } catch (e) { return JSON.parse(d) } };
const money = n => "Rp" + Number(n || 0).toLocaleString("id-ID");
const PAY_DEFAULT = '{"qris":{"enabled":false,"name":"","image":""},"bank":{"enabled":false,"name":"","number":"","owner":""}}';

const qs = new URLSearchParams(location.search);
const A = PUB.affiliate ? [PUB.affiliate] : [];
const P = PUB.payments || JSON.parse(PAY_DEFAULT);
P.qris = P.qris || {}; P.bank = P.bank || {};
const ref = (qs.get("ref") || "").toUpperCase();
const affiliate = A.find(x => x.code === ref && x.active !== false);

const STATUS = {
  WAITING_PAYMENT: ["Menunggu pembayaran", ""],
  WAITING_VERIFICATION: ["Menunggu verifikasi admin", "yellow"],
  PAID: ["Lunas / terverifikasi", "green"],
  CANCELLED: ["Dibatalkan", "red"]
};

$("aff").textContent = affiliate ? affiliate.name : "Tidak terdeteksi";
$("code").textContent = affiliate ? affiliate.code : "-";

/* ---------- tombol LIHAT PRODUK (link sama untuk semua affiliate, diatur admin) ---------- */
const PRODUCT_LINK = String(PUB.product_link || "").trim();
if (/^https?:\/\//i.test(PRODUCT_LINK)) {
  $("prodTop").innerHTML = `<a class="btnlink prodbtn" target="_blank" rel="noopener" href="${esc(PRODUCT_LINK)}">LIHAT PRODUK</a>`;
}

/* ---------- pilihan metode pembayaran ---------- */
let m = "";
if (P.qris.enabled) m += `<label class="method"><input type="radio" name="pm" value="QRIS" checked style="width:auto;margin-right:6px"><b>QRIS</b><br><span class="small">${esc(P.qris.name || "Scan QRIS")}</span>${P.qris.image ? `<img class="qris" src="${P.qris.image}">` : ""}</label>`;
if (P.bank.enabled) m += `<label class="method"><input type="radio" name="pm" value="TRANSFER_BANK" ${P.qris.enabled ? "" : "checked"} style="width:auto;margin-right:6px"><b>Transfer Bank</b><br>${esc(P.bank.name)}<br>No. Rek: <b>${esc(P.bank.number)}</b> <button type="button" class="copybtn" data-copy="${esc(P.bank.number)}" onclick="event.preventDefault();event.stopPropagation();copyText(this.dataset.copy,'Nomor rekening')">Salin</button><br>A/N: ${esc(P.bank.owner)}</label>`;
if (!m) m = "<div class='small'>Belum ada metode pembayaran aktif.</div>";
$("methods").innerHTML = m;

/* ---------- helper ---------- */
function payHTML(method) {
  if (method === "QRIS") return `<div class="method"><b>QRIS</b><br><span class="small">${esc(P.qris.name || "Scan QRIS")}</span>${P.qris.image ? `<img class="qris" src="${P.qris.image}">` : ""}</div>`;
  if (method === "TRANSFER_BANK") return `<div class="method"><b>Transfer Bank</b><br>${esc(P.bank.name)}<br>No. Rek: <b>${esc(P.bank.number)}</b> <button type="button" class="copybtn" data-copy="${esc(P.bank.number)}" onclick="event.preventDefault();event.stopPropagation();copyText(this.dataset.copy,'Nomor rekening')">Salin</button><br>A/N: ${esc(P.bank.owner)}</div>`;
  return `<div class="small">Metode pembayaran belum diatur. Hubungi affiliate.</div>`;
}

function copyText(t, label) {
  const name = label || "Teks";
  const fb = () => {
    try {
      const x = document.createElement("textarea");
      x.value = t; x.setAttribute("readonly", ""); x.style.position = "fixed"; x.style.opacity = "0";
      document.body.appendChild(x); x.select();
      const ok = document.execCommand("copy"); x.remove();
      if (!ok) throw 0;
      alert(name + " disalin");
    } catch (e) { prompt("Salin " + name.toLowerCase() + " ini:", t); }
  };
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(t).then(() => alert(name + " disalin")).catch(fb);
  else fb();
}

async function findOrder(id) {
  try { return await rpc("kb_get_order", { p_id: id }); } catch (e) { return null; }
}

function waNumber(raw) {
  let n = String(raw || "").replace(/\D/g, "");
  if (n.startsWith("0")) n = "62" + n.slice(1);
  else if (n.startsWith("8")) n = "62" + n;
  return n;
}

/* ---------- tampilan pesanan ---------- */
function showOrder(o) {
  const st = STATUS[o.status] || [o.status, ""];
  const num = waNumber(o.affiliate_wa);
  const msg = `Halo ${o.affiliate_name || ""}, saya ${o.customer} sudah melakukan pembayaran untuk pesanan ${o.order_id}.`;
  const methodLabel = o.payment_method === "QRIS" ? "QRIS" : o.payment_method === "TRANSFER_BANK" ? "Transfer Bank" : "-";

  let body = "";
  if (o.status === "WAITING_PAYMENT") {
    body = `
      ${payHTML(o.payment_method)}
      <div class="box"><b>Langkah pembayaran</b>
        <ol>
          <li>Bayar ${o.total ? "sesuai total <b>" + money(o.total) + "</b>" : "sesuai nominal yang disepakati"} ke tujuan di atas.</li>
          <li>Tulis nomor order <b>${esc(o.order_id)}</b> di catatan / berita transfer.</li>
          <li>Setelah membayar, konfirmasi ke affiliate agar pembayaran kamu diverifikasi.</li>
        </ol>
      </div>
      ${num ? `<a class="btnlink" target="_blank" rel="noopener" href="https://wa.me/${num}?text=${encodeURIComponent(msg)}">Konfirmasi ke Affiliate via WhatsApp</a>` : `<div class="small" style="margin-top:12px">Hubungi affiliate kamu dan sebutkan nomor order untuk konfirmasi pembayaran.</div>`}`;
  } else if (o.status === "WAITING_VERIFICATION") {
    body = `<div class="box">Pembayaran kamu sedang diverifikasi oleh admin. Simpan nomor order ini dan cek statusnya lagi nanti.</div>`;
  } else if (o.status === "PAID") {
    body = `<div class="box">Pembayaran sudah terverifikasi. Terima kasih sudah berbelanja di KABAURIA!</div>`;
  } else if (o.status === "CANCELLED") {
    const by = o.cancelled_by === "ADMIN" ? "admin" : o.cancelled_by ? "affiliate" : "";
    body = `<div class="cancelbox"><b>Pesanan dibatalkan${by ? " oleh " + by : ""}</b><br>Catatan: ${esc(o.cancel_note || "-")}</div>`;
  }
  if (o.status !== "CANCELLED") body += `<div class="notice">🚚 Gratis ongkir area dalam kota, admin segera menghubungi anda</div>`;
  const extra = (o.address ? `<div class="box"><b>Alamat pengiriman</b><br>${esc(o.address).replace(/\n/g, "<br>")}${o.note ? `<br><br><b>Catatan</b><br>${esc(o.note).replace(/\n/g, "<br>")}` : ""}</div>` : "");

  $("form").style.display = "none";
  $("aff").textContent = o.affiliate_name || "Tidak terdeteksi";
  $("code").textContent = o.affiliate_code || "-";
  const r = $("result");
  r.style.display = "block";
  r.innerHTML = `
    <b>Nomor Order</b>
    <div class="oid">${esc(o.order_id)}</div>
    <div>Status: <span class="badge ${st[1]}">${esc(st[0])}</span></div>
    <div class="small" style="margin-top:8px">${[o.product || o.product_note, o.qty ? "Jumlah " + o.qty : "", o.total ? money(o.total) : "", methodLabel].filter(Boolean).map(esc).join(" · ")}</div>
    ${extra}
    ${body}
    <button type="button" onclick="copyText('${esc(o.order_id)}','Nomor order')">Salin Nomor Order</button>
    <button type="button" class="gray" onclick="refreshOrder('${esc(o.order_id)}')">Perbarui Status</button>
    <button type="button" class="gray" onclick="newOrder()">Buat Pesanan Baru</button>`;
}

async function refreshOrder(id) {
  const o = await findOrder(id);
  if (!o) return alert("Pesanan tidak ditemukan.");
  showOrder(o);
}

function newOrder() {
  location.href = location.pathname + (ref ? "?ref=" + encodeURIComponent(ref) : "");
}

function setUrl(id) {
  try {
    const u = new URLSearchParams();
    if (ref) u.set("ref", ref);
    u.set("order", id);
    history.replaceState(null, "", location.pathname + "?" + u.toString());
  } catch (e) {}
}

/* ---------- nomor order otomatis: KBR-KODEAFFILIATE-URUTAN ---------- */
function nextOrderId(all, code) {
  const clean = String(code || "").toUpperCase().replace(/[^A-Z0-9]/g, "") || "UMUM";
  const prefix = "KBR-" + clean + "-";
  let max = 0;
  all.forEach(x => {
    const id = String(x.order_id || "");
    if (id.startsWith(prefix)) {
      const rest = id.slice(prefix.length);
      if (/^\d+$/.test(rest) && Number(rest) > max) max = Number(rest);
    }
  });
  return prefix + String(max + 1).padStart(3, "0");
}

/* ---------- buat pesanan ---------- */
$("form").onsubmit = async e => {
  e.preventDefault();
  const sel = document.querySelector("input[name=pm]:checked");
  const method = sel ? sel.value : "";
  if (!method) return alert("Belum ada metode pembayaran yang aktif. Hubungi affiliate.");
  if ($("wa").value.replace(/\D/g, "").length < 9) return alert("Nomor WhatsApp tidak valid.");
  const addrV = $("address").value.trim();
  if (addrV.length < 8) return alert("Alamat pengiriman belum lengkap.");
  const qtyV = Number($("qty").value), totalV = Number(String($("total").value).replace(/[^0-9]/g, ""));
  if (!Number.isInteger(qtyV) || qtyV < 1 || qtyV > 9999) return alert("Jumlah tidak valid (minimal 1).");
  if (!Number.isSafeInteger(totalV) || totalV <= 0 || totalV > 1000000000) return alert("Total harga tidak valid.");

  const btn = e.submitter; if (btn) btn.disabled = true;
  let o;
  try {
    o = await rpc("kb_create_order", { p: {
      affiliate_code: affiliate ? affiliate.code : "",
      customer: $("customer").value.trim(), wa: $("wa").value.trim(),
      address: addrV, note: $("note").value.trim(), product_note: $("item").value.trim(),
      qty: qtyV, total: totalV, payment_method: method } });
  } catch (err) { if (btn) btn.disabled = false; return alert("Gagal membuat pesanan: " + err.message); }
  const id = o.order_id;
  setUrl(id);
  showOrder(o);
};

/* ---------- cek status ---------- */
async function checkOrder() {
  const id = $("chk").value.trim().toUpperCase().replace(/\s/g, "");
  const out = $("chkres");
  if (!id) { out.textContent = "Masukkan nomor order terlebih dahulu."; return; }
  const o = await findOrder(id);
  if (!o) { out.textContent = "Nomor order tidak ditemukan. Pastikan nomornya benar."; return; }
  out.textContent = "";
  setUrl(id);
  showOrder(o);
  window.scrollTo(0, 0);
}
$("chkbtn").onclick = checkOrder;
$("chk").addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); checkOrder(); } });

/* ---------- buka langsung dari ?order=ID ---------- */
const oq = (qs.get("order") || "").toUpperCase();
if (oq) findOrder(oq).then(o => { if (o) showOrder(o); });
</script>
<script>(async()=>{try{window.PUB=await rpc("kb_public",{p_code:(new URLSearchParams(location.search).get("ref")||"").toUpperCase()})}catch(e){document.body.innerHTML="<p style='padding:24px;font-family:Arial'>Gagal terhubung ke server. Muat ulang halaman.</p>";return}const s=document.createElement("script");s.textContent=document.getElementById("app").textContent;document.body.appendChild(s)})();</script>
</body>
</html>
